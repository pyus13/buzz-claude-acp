name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: plugin/plugin.js matches src/
        run: npm run check
      - name: Icons match their sources
        run: npm run icons -- --check
      - name: The manifest pins the adapter
        run: node -e "const p=require('./plugin/manifest.json').host.processes[0]; if (p.program!=='npx' || !/@\d+\.\d+\.\d+$/.test(p.args.at(-1))) process.exit(1)"
